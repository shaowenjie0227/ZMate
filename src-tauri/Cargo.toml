[package]
name = "zmate"
version = "0.1.0"
default-run = "ZMate"
description = "ZCode 桌面伴侣 — 供应商注入、MCP、Skills、会话管理"
authors = ["shaowenjie"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zmate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ZMate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "socks", "cookies"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSThread", "NSGeometry", "NSValue", "NSArray", "NSString", "NSNotification", "NSOperation", "NSBundle"] }
objc2-app-kit = { version = "0.3", features = ["NSScreen", "NSWindow", "NSRunningApplication", "NSApplication", "NSWorkspace", "NSEvent", "NSColor"] }
